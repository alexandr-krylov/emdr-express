services:

  php:
    build:
      context: .
      dockerfile: Dockerfile-php
    volumes:
      - .:/var/www/html
    expose:
      - 9000
    networks:
      - web_network

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - web_network

networks:
  web_network:
    driver: bridge
